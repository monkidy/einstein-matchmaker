<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><style>text{font-family:"Segoe UI",ui-sans-serif,system-ui,sans-serif}.kick{font-size:26px;fill:#6b6253;letter-spacing:.18em}.h1{font-size:62px;font-weight:650;fill:#1f2328}.quote{font-size:36px;fill:#1f2328;font-style:italic}.body{font-size:32px}.row{font-size:34px;fill:#6b6253}.rowv{font-size:34px;font-weight:650}.num{font-size:92px;font-weight:700}.cap{font-size:26px;fill:#6b6253}.pill{font-size:21px;fill:#6b6253;font-family:ui-monospace,Consolas,monospace}.mono{font-size:27px;fill:#6b6253;font-family:ui-monospace,Consolas,monospace}</style><rect width="1920" height="1080" fill="#f6f1e7"/><text x="130" y="150" class="kick">THE PROBLEM</text><text x="130" y="228" class="h1">A company knows its pain. It does not know</text><text x="130" y="304" class="h1">who can fix it.</text><rect x="130" y="386" width="10" height="286" fill="#0b5fa5"/><text x="178" y="428" class="quote">We assemble 200 to 300 units per month on a mixed-model line</text><text x="178" y="478" class="quote">with three operators, but scheduling which variant to build on</text><text x="178" y="528" class="quote">which shift is done on paper and we routinely end up with</text><text x="178" y="578" class="quote">stockouts on one SKU and overstock on another, tying up</text><text x="178" y="628" class="quote">roughly €40,000 in unnecessary inventory.</text><text x="130" y="694" class="body" fill="#6b6253">One of 489 challenges in the corpus, and 1047 researchers to look through.</text><line x1="130" y1="975" x2="1790" y2="975" stroke="#d8cfbe" stroke-width="2"/><text x="130" y="1018" class="pill">REAL RUN  .  31 Oct 2026  .  Qwen3-4B Q4_K_M, CPU only  .  organizer corpus v2  .  fictional dataset  .  edited for length</text></svg>