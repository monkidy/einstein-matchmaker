<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><style>text{font-family:"Segoe UI",ui-sans-serif,system-ui,sans-serif}.kick{font-size:26px;fill:#6b6253;letter-spacing:.18em}.h1{font-size:62px;font-weight:650;fill:#1f2328}.quote{font-size:36px;fill:#1f2328;font-style:italic}.body{font-size:32px}.row{font-size:34px;fill:#6b6253}.rowv{font-size:34px;font-weight:650}.num{font-size:92px;font-weight:700}.cap{font-size:26px;fill:#6b6253}.pill{font-size:21px;fill:#6b6253;font-family:ui-monospace,Consolas,monospace}.mono{font-size:27px;fill:#6b6253;font-family:ui-monospace,Consolas,monospace}</style><rect width="1920" height="1080" fill="#f6f1e7"/><text x="130" y="150" class="kick">WHAT WE DO NOT CLAIM</text><text x="130" y="228" class="h1">No answer key exists, so no advantage is</text><text x="130" y="304" class="h1">claimed.</text><text x="130" y="428" class="row">Hidden jury answer key available</text><text x="900" y="428" class="rowv" fill="#9a6700">no</text><text x="130" y="484" class="row">Usefulness uplift proven</text><text x="900" y="484" class="rowv" fill="#9a6700">no, and not claimed</text><line x1="130" y1="540" x2="1790" y2="540" stroke="#d8cfbe" stroke-width="2"/><text x="130" y="584" class="body" fill="#6b6253">The verifier reports what it could not establish, not only what passed. The</text><text x="130" y="628" class="body" fill="#6b6253">README marks every statement PROVEN or NOT CLAIMED in a table at the top, and</text><text x="130" y="672" class="body" fill="#6b6253">this line is one of them. A speed or quality advantage has to be measured. It</text><text x="130" y="716" class="body" fill="#6b6253">is never inferred from the number of agents.</text><line x1="130" y1="975" x2="1790" y2="975" stroke="#d8cfbe" stroke-width="2"/><text x="130" y="1018" class="pill">DRAWN FROM THE TRACE  .  no interpolated value</text></svg>