<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><style>text{font-family:"Segoe UI",ui-sans-serif,system-ui,sans-serif}.kick{font-size:26px;fill:#6b6253;letter-spacing:.18em}.h1{font-size:62px;font-weight:650;fill:#1f2328}.quote{font-size:36px;fill:#1f2328;font-style:italic}.body{font-size:32px}.row{font-size:34px;fill:#6b6253}.rowv{font-size:34px;font-weight:650}.num{font-size:92px;font-weight:700}.cap{font-size:26px;fill:#6b6253}.pill{font-size:21px;fill:#6b6253;font-family:ui-monospace,Consolas,monospace}.mono{font-size:27px;fill:#6b6253;font-family:ui-monospace,Consolas,monospace}</style><rect width="1920" height="1080" fill="#f6f1e7"/><text x="130" y="150" class="kick">THE HONEST PART</text><text x="130" y="228" class="h1">A refusal on the evidence is not a refusal</text><text x="130" y="304" class="h1">on the clock.</text><text x="130" y="438" class="num" fill="#1a7f37">2</text><text x="130" y="486" class="cap">accepted</text><text x="700" y="438" class="num" fill="#0b5fa5">1</text><text x="700" y="486" class="cap">refused on the evidence</text><text x="1270" y="438" class="num" fill="#9a6700">3</text><text x="1270" y="486" class="cap">ran out of time</text><text x="130" y="628" class="body" fill="#6b6253">A case that ends on the clock has said nothing about its sources, so the three</text><text x="130" y="672" class="body" fill="#6b6253">are never added together, here or in the repository. That distinction is also</text><text x="130" y="716" class="body" fill="#6b6253">where the architectures differ: at an equal time budget, the question becomes</text><text x="130" y="760" class="body" fill="#6b6253">how many cases an arm can finish at all.</text><line x1="130" y1="975" x2="1790" y2="975" stroke="#d8cfbe" stroke-width="2"/><text x="130" y="1018" class="pill">REAL RUN  .  31 Oct 2026  .  Qwen3-4B Q4_K_M, CPU only  .  organizer corpus v2  .  fictional dataset  .  edited for length</text></svg>