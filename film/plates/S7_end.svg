<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><style>text{font-family:"Segoe UI",ui-sans-serif,system-ui,sans-serif}.kick{font-size:26px;fill:#6b6253;letter-spacing:.18em}.h1{font-size:62px;font-weight:650;fill:#1f2328}.quote{font-size:36px;fill:#1f2328;font-style:italic}.body{font-size:32px}.row{font-size:34px;fill:#6b6253}.rowv{font-size:34px;font-weight:650}.num{font-size:92px;font-weight:700}.cap{font-size:26px;fill:#6b6253}.pill{font-size:21px;fill:#6b6253;font-family:ui-monospace,Consolas,monospace}.mono{font-size:27px;fill:#6b6253;font-family:ui-monospace,Consolas,monospace}</style><rect width="1920" height="1080" fill="#f6f1e7"/><text x="130" y="150" class="kick"></text><text x="130" y="228" class="h1">EINSTEIN Matchmaker</text><text x="130" y="352" class="body" fill="#1f2328">A system that cannot refuse cannot be trusted when it</text><text x="130" y="396" class="body" fill="#1f2328">accepts.</text><text x="130" y="480" class="mono">github.com/monkidy/einstein-matchmaker</text><text x="130" y="540" class="cap">The code, the traces and the verdicts are all in the repository.</text><line x1="130" y1="975" x2="1790" y2="975" stroke="#d8cfbe" stroke-width="2"/><text x="130" y="1018" class="pill">Narration: synthetic voice (Asso, SYSTASYS).  .  Entry by Hichem Benali, solo.</text></svg>