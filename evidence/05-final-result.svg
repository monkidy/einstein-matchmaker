<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><style>text{font-family:"Segoe UI",ui-sans-serif,system-ui,sans-serif}.kick{font-size:26px;fill:#6b6253;letter-spacing:.18em}.h1{font-size:62px;font-weight:650;fill:#1f2328}.quote{font-size:36px;fill:#1f2328;font-style:italic}.body{font-size:32px}.row{font-size:34px;fill:#6b6253}.rowv{font-size:34px;font-weight:650}.num{font-size:92px;font-weight:700}.cap{font-size:26px;fill:#6b6253}.pill{font-size:21px;fill:#6b6253;font-family:ui-monospace,Consolas,monospace}.mono{font-size:27px;fill:#6b6253;font-family:ui-monospace,Consolas,monospace}</style><rect width="1920" height="1080" fill="#f6f1e7"/><text x="130" y="150" class="kick">THE RESULT</text><text x="130" y="228" class="h1">Concurrency bought time and cost cases.</text><text x="130" y="352" class="cap">Arm</text><text x="760" y="352" class="cap">Accepted</text><text x="1090" y="352" class="cap">Controls refused</text><text x="1540" y="352" class="cap">Wall time</text><text x="130" y="406" class="row" fill="#1f2328">Solo, 1 agent</text><text x="760" y="406" class="rowv" fill="#1f2328">12 / 24</text><text x="1090" y="406" class="rowv" fill="#1f2328">6 / 6</text><text x="1540" y="406" class="rowv" fill="#1f2328">67.0 min</text><text x="130" y="468" class="row" fill="#1f2328">Serial, 4 agents</text><text x="760" y="468" class="rowv" fill="#1f2328">12 / 24</text><text x="1090" y="468" class="rowv" fill="#1f2328">6 / 6</text><text x="1540" y="468" class="rowv" fill="#1f2328">67.1 min</text><text x="130" y="530" class="row" fill="#0b5fa5">Parallel, 4 agents</text><text x="760" y="530" class="rowv" fill="#9a6700">9 / 24</text><text x="1090" y="530" class="rowv" fill="#1f2328">6 / 6</text><text x="1540" y="530" class="rowv" fill="#1a7f37">54.6 min</text><line x1="130" y1="592" x2="1790" y2="592" stroke="#d8cfbe" stroke-width="2"/><text x="130" y="636" class="body" fill="#6b6253">The two sequential arms agree on all 24 cases. The parallel arm differs on 3. That</text><text x="130" y="680" class="body" fill="#6b6253">control pair is what makes the gap readable: it is attributable to concurrency, not to</text><text x="130" y="724" class="body" fill="#6b6253">noise. All three arms refuse all six missing-evidence controls.</text><text x="130" y="778" class="body" fill="#1f2328">18.5 percent faster, three fewer accepted out of twenty-four. No quality uplift is</text><text x="130" y="822" class="body" fill="#1f2328">claimed, because none was measured.</text><line x1="130" y1="975" x2="1790" y2="975" stroke="#d8cfbe" stroke-width="2"/><text x="130" y="1018" class="pill">INDEPENDENT VERDICT PASS . 12/12 blocks . 72/72 case-arms . same 24 cases per arm</text></svg>