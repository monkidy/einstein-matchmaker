<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1064" width="1600" height="1064" role="img" aria-label="An accepted proposal, and what it had to prove"><style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.h1{font-size:40px;font-weight:650;fill:#1f2328}.sub{font-size:21px;fill:#59636e}.lbl{font-size:24px;fill:#59636e}.val{font-size:24px;font-weight:600}.body{font-size:23px}.mono{font-size:20px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.src{font-size:19px;fill:#59636e;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}</style><rect width="1600" height="1064" fill="#ffffff"/><text x="56" y="68" class="h1">An accepted proposal, and what it had to prove</text><text x="56" y="104" class="sub">Case N02 - accepted only after an independent critic and a source audit</text><line x1="56" y1="130" x2="1544" y2="130" stroke="#d1d9e0"/><text x="56" y="180" class="lbl">Company</text><text x="560" y="180" class="val" fill="#1f2328">Pulmoteh d.o.o. (C102)</text><text x="56" y="226" class="lbl">Researcher</text><text x="560" y="226" class="val" fill="#1f2328">Lazar Marković (R0763)</text><text x="56" y="272" class="lbl">Independent critic</text><text x="560" y="272" class="val" fill="#1a7f37">accepted</text><text x="56" y="318" class="lbl">Factual claims, each quoting a source field</text><text x="560" y="318" class="val" fill="#0969da">8</text><text x="56" y="364" class="lbl">Model calls / wall time</text><text x="560" y="364" class="val" fill="#1f2328">4 calls, 205 s</text><line x1="56" y1="428" x2="1544" y2="428" stroke="#d1d9e0"/><text x="56" y="470" class="lbl" fill="#1f2328">Why this pair, in the system's own words:</text><text x="56" y="510" class="body" fill="#59636e">Marković's work on simulation and scheduling aligns with the need for a tool that integrates production data and handles</text><text x="56" y="544" class="body" fill="#59636e">sequence-dependent inventory costs.</text><line x1="56" y1="596" x2="1544" y2="596" stroke="#d1d9e0"/><text x="56" y="638" class="lbl" fill="#1f2328">One of its claims, as stored - a quotation, not a summary:</text><text x="56" y="678" class="body" fill="#1f2328">&quot;We assemble 200 to 300 units per month on a mixed-model line with three operators, but scheduling which variant to</text><text x="56" y="712" class="body" fill="#1f2328">build on which shift is done on paper and we routinely end up with stockouts on one SKU and overstock on another, tying</text><text x="56" y="746" class="body" fill="#1f2328">up roughly €40,000 in unnecessary inventory.&quot;</text><text x="56" y="792" class="mono" fill="#59636e">field: text</text><text x="56" y="824" class="mono" fill="#59636e">file: data/companies.json</text><text x="56" y="856" class="mono" fill="#59636e">locator: /companies/101/challenges/2</text><text x="56" y="888" class="mono" fill="#59636e">record SHA-256: 42a54205b3b33d14d17d51bb6bee5030047b6868276f023c...</text><text x="56" y="926" class="mono" fill="#0969da">immutable source: https://github.com/jigjoy-ai/einstein-matchmaker-data/blob/4fb99b3749adf0d10b5977089ff4c73f4f522240/data/companies.json</text><line x1="56" y1="966" x2="1544" y2="966" stroke="#d1d9e0"/><text x="56" y="1004" class="src">Source: runs/benchmark-v2/block-1/parallel/results.json</text></svg>