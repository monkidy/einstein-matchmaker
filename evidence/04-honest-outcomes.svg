<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 912" width="1600" height="912" role="img" aria-label="Outcomes, with the abstentions told apart"><style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.h1{font-size:40px;font-weight:650;fill:#1f2328}.sub{font-size:21px;fill:#59636e}.lbl{font-size:24px;fill:#59636e}.val{font-size:24px;font-weight:600}.body{font-size:23px}.mono{font-size:20px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.src{font-size:19px;fill:#59636e;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}</style><rect width="1600" height="912" fill="#ffffff"/><text x="56" y="68" class="h1">Outcomes, with the abstentions told apart</text><text x="56" y="104" class="sub">A refusal on the evidence and a refusal on the clock are not the same result</text><line x1="56" y1="130" x2="1544" y2="130" stroke="#d1d9e0"/><text x="56" y="180" class="lbl">Accepted</text><text x="560" y="180" class="val" fill="#1a7f37">2 of 6</text><text x="56" y="226" class="lbl">Refused on the evidence</text><text x="560" y="226" class="val" fill="#0969da">1 of 6</text><text x="56" y="272" class="lbl">Ran out of time (deadline, not evidence)</text><text x="560" y="272" class="val" fill="#9a6700">3 of 6</text><line x1="56" y1="336" x2="1544" y2="336" stroke="#d1d9e0"/><text x="56" y="378" class="val" fill="#0969da">N01</text><text x="190" y="378" class="val" fill="#0969da">REFUSED</text><text x="420" y="378" class="body" fill="#59636e">Uncertain link between citric acid pre-treatment and gel layer formation in dairy wastew</text><text x="56" y="422" class="val" fill="#1a7f37">N02</text><text x="190" y="422" class="val" fill="#1a7f37">ACCEPTED</text><text x="420" y="422" class="body" fill="#59636e">INDEPENDENT_SOURCE_AND_PLAUSIBILITY_GATE_PASS</text><text x="56" y="466" class="val" fill="#9a6700">N03</text><text x="190" y="466" class="val" fill="#9a6700">TIMEOUT</text><text x="420" y="466" class="body" fill="#59636e">The operation was aborted due to timeout</text><text x="56" y="510" class="val" fill="#1a7f37">N04</text><text x="190" y="510" class="val" fill="#1a7f37">ACCEPTED</text><text x="420" y="510" class="body" fill="#59636e">INDEPENDENT_SOURCE_AND_PLAUSIBILITY_GATE_PASS</text><text x="56" y="554" class="val" fill="#9a6700">N05</text><text x="190" y="554" class="val" fill="#9a6700">TIMEOUT</text><text x="420" y="554" class="body" fill="#59636e">The operation was aborted due to timeout</text><text x="56" y="598" class="val" fill="#9a6700">N06</text><text x="190" y="598" class="val" fill="#9a6700">TIMEOUT</text><text x="420" y="598" class="body" fill="#59636e">The operation was aborted due to timeout</text><line x1="56" y1="660" x2="1544" y2="660" stroke="#d1d9e0"/><text x="56" y="702" class="body" fill="#59636e">Under a per-call deadline with a ceiling of four model calls on four CPU threads, some cases end without an answer. That is a budget</text><text x="56" y="736" class="body" fill="#59636e">limit, not a judgement about the sources, and it is counted separately everywhere in this submission. It is also the variable that</text><text x="56" y="770" class="body" fill="#59636e">distinguishes the architectures: at an equal budget, the question becomes how many cases an arm can finish at all.</text><line x1="56" y1="814" x2="1544" y2="814" stroke="#d1d9e0"/><text x="56" y="852" class="src">Source: runs/benchmark-v2/block-1/parallel/results.json</text></svg>